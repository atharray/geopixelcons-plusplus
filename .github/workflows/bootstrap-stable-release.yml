name: Bootstrap stable release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create the one-time v2.0.0 baseline and upload its userscript
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_VERSION: 2.0.0
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "$INITIAL_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "v${version} already exists; refusing to retag it."
            exit 1
          fi
          npm run verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${version}" -m "GeoPixelcons++ v${version}"
          git push origin "v${version}"
          gh release create "v${version}" "dist/${version}.user.js" --title "GeoPixelcons++ v${version}" --generate-notes
